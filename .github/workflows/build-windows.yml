name: Windows executable
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and test
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt pytest
          .\.venv\Scripts\python.exe -m pytest -q tests
          .\.venv\Scripts\python.exe tests/smoke_gui.py
          foreach ($scale in @('1.25','1.5')) {
            $env:QT_SCALE_FACTOR = $scale
            .\.venv\Scripts\python.exe tests\smoke_gui.py
            if ($LASTEXITCODE -ne 0) { throw "Qt smoke failed at scale $scale" }
          }
          Remove-Item Env:QT_SCALE_FACTOR -ErrorAction SilentlyContinue
      - name: Build portable exe
        shell: pwsh
        run: .\build-windows.ps1
      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'dist/Larevixo.exe' -PathType Leaf)) {
            throw 'The build completed without producing dist/Larevixo.exe.'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Larevixo-Windows
          path: dist/Larevixo.exe
          if-no-files-found: error
          retention-days: 14
