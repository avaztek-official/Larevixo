name: Windows executable
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install and test
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt pytest
          .\.venv\Scripts\python.exe -m pytest -q tests
          .\.venv\Scripts\python.exe tests/smoke_gui.py
          foreach ($scale in @('1.25','1.5')) {
            $env:QT_SCALE_FACTOR = $scale
            .\.venv\Scripts\python.exe tests\smoke_gui.py
            if ($LASTEXITCODE -ne 0) { throw "Qt smoke failed at scale $scale" }
          }
          Remove-Item Env:QT_SCALE_FACTOR -ErrorAction SilentlyContinue
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey could not install Inno Setup.' }

          $programFilesX86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $programFiles = [Environment]::GetFolderPath('ProgramFiles')
          $compilerCandidates = @(
            (Join-Path $programFilesX86 'Inno Setup 7\ISCC.exe'),
            (Join-Path $programFilesX86 'Inno Setup 6\ISCC.exe'),
            (Join-Path $programFiles 'Inno Setup 7\ISCC.exe'),
            (Join-Path $programFiles 'Inno Setup 6\ISCC.exe')
          )
          $compiler = $compilerCandidates |
            Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
            Select-Object -First 1
          if (-not $compiler) {
            throw 'Chocolatey installed Inno Setup, but the real ISCC.exe was not found.'
          }

          Add-Content -LiteralPath $env:GITHUB_ENV -Value "INNO_SETUP_COMPILER=$compiler"
      - name: Build portable exe and installer
        shell: pwsh
        run: .\build-installer.ps1
      - name: Verify release files
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath 'VERSION' -Raw).Trim()
          $portable = 'dist/Larevixo.exe'
          $installer = "dist/Larevixo-Setup-$version.exe"

          foreach ($file in @($portable, $installer)) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "The build did not produce the expected file: $file"
            }
          }
      - uses: actions/upload-artifact@v6
        with:
          name: Larevixo-Windows
          path: dist/Larevixo.exe
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v6
        with:
          name: Larevixo-WindowsInstaller
          path: dist/Larevixo-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
